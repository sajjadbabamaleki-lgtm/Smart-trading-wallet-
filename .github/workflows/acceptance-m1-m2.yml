name: Acceptance — M1/M2

# Evidence workflow, not ordinary CI.
#
# Ordinary CI (ci.yml) stays fast, deterministic and offline. This workflow does
# the opposite on purpose: it starts real infrastructure and reads real public
# market data, so it is slow, depends on a third party, and can legitimately
# fail for reasons outside this repository. Running it on every commit would
# make those failures routine and therefore ignored.
#
# It is manual by default. `workflow_dispatch` only.
#
# The acceptance steps themselves live in
# `infrastructure/scripts/accept_m1_m2.sh`, which this workflow calls rather
# than restates. The same script is what `make accept` runs on a developer
# machine, so an acceptance result means the same thing wherever it was
# produced. That matters here specifically: GitHub Actions has rejected every
# job ever queued in this repository at zero billable milliseconds
# (docs/evidence/build-0.1/acceptance-attempts.md), so the local path is the
# one that currently works — and it must not be a second, divergent
# implementation of the same verification.
#
# Safety: this is a MARKET-DATA verification, not a trading verification. It
# holds no credential, submits no order, and the script asserts the execution
# guard before connecting. Public Hyperliquid market data is read-only; mainnet
# execution stays hard-blocked by `libs/config/settings.py` (ADR-009).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to record from the live venue"
        required: false
        default: "5"
      market_data_environment:
        description: "Where to read market data from (execution stays blocked)"
        required: false
        default: "MAINNET_PUBLIC"
        type: choice
        options:
          - MAINNET_PUBLIC
          - TESTNET
      minimum_frames:
        description: "Below this the live observation is inconclusive"
        required: false
        default: "50"

# Read-only. No environment is attached and no secret is needed, so there is
# nothing here for a compromised step to exfiltrate (Phase 10 §34).
permissions:
  contents: read

concurrency:
  group: acceptance-m1-m2
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.17"
  EVIDENCE_DIR: evidence

jobs:
  acceptance:
    name: M1 storage + M2 live venue
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Everything from preflight through the verdict. The script writes its
      # evidence as it goes and collects container logs on the way out, so a
      # failure here still leaves the artifact worth uploading.
      - name: Run the acceptance
        run: |
          bash infrastructure/scripts/accept_m1_m2.sh \
            --minutes "${{ inputs.minutes }}" \
            --market-data "${{ inputs.market_data_environment }}" \
            --minimum-frames "${{ inputs.minimum_frames }}" \
            --out "$EVIDENCE_DIR" \
            --stop-stack

      - name: Summarise into the run summary
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$EVIDENCE_DIR/m1-m2-acceptance.md" ]; then
            cat "$EVIDENCE_DIR/m1-m2-acceptance.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Acceptance report was not produced"
              echo ""
              echo "The run failed before the report could be written. See the"
              echo "uploaded evidence for the step that failed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Uploaded whatever happened. A failed acceptance run with preserved
      # evidence is more valuable than a green one without it.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m2-acceptance-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 90
