# Local development stack (M1 verifies these; M0 provides the definition).
#
# Every service binds to 127.0.0.1 only. A database reachable from the network
# with development credentials is the sort of accident Phase 10 §9 and §59 exist
# to prevent, and a compose file is the place to make that structural.
#
# Credentials here are local-development values and are deliberately visible:
# this stack holds no real capital, no mainnet credential and no user data.
# Production configuration comes from a secrets manager, never from a file.

name: stw-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stw
      POSTGRES_PASSWORD: stw
      POSTGRES_DB: stw
      # Deterministic collation, so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stw -d stw"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: stw
      CLICKHOUSE_PASSWORD: stw
      CLICKHOUSE_DB: stw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP
      - "127.0.0.1:9009:9000"   # native; 9000 left free for MinIO
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: Redis is cache and ephemeral coordination only, and must
    # never become the authoritative source of capital state
    # (Build 0.1 Rev.1 §15). Turning off saving makes that structural rather
    # than a convention someone could rely on by accident.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO is pulled from quay.io, not Docker Hub. MinIO withdrew both
  # `minio/minio` and `minio/mc` from Docker Hub; quay.io is its own registry
  # and still serves the same releases publicly. The withdrawal is worth
  # recording because of how it fails: Docker Hub answers an anonymous client
  # with 401, so the error reads "pull access denied ... may require 'docker
  # login'" — a credentials problem that is really a missing repository, and
  # an hour lost looking in the wrong place.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: stw
      MINIO_ROOT_PASSWORD: stw-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the raw bucket with versioning enabled, then exits.
  # Versioning matters: the Bronze layer is append-oriented and effectively
  # immutable, and if a provider revises history both versions must remain
  # traceable (Phase 3 §17).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 stw stw-dev-only
        mc mb --ignore-existing local/stw-raw
        mc version enable local/stw-raw
        echo "object store ready"
    restart: "no"

volumes:
  postgres-data:
  clickhouse-data:
  minio-data:
