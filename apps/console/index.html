<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Trading Wallet</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <span class="mark">STW</span>
      <span class="wordmark">Smart Trading Wallet</span>
    </div>

    <nav>
      <a href="#/dashboard" data-route="dashboard"><i>▤</i>Dashboard</a>
      <a href="#/positions" data-route="positions"><i>◧</i>Positions</a>
      <a href="#/activity"  data-route="activity"><i>≡</i>Activity</a>
      <a href="#/data"      data-route="data"><i>◈</i>Market data</a>
      <a href="#/research"  data-route="research"><i>∿</i>Research</a>
      <a href="#/risk"      data-route="risk"><i>⬡</i>Risk</a>
      <a href="#/account"   data-route="account"><i>◉</i>Account</a>
    </nav>

    <div class="sidebar-foot">
      <div class="killswitch" id="killswitch">
        <span class="dot"></span>
        <div>
          <strong>Kill switch</strong>
          <small id="killswitch-state">…</small>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">

    <header class="topbar">
      <div class="modes" id="modes" role="tablist" aria-label="Operating mode"></div>
      <div class="topbar-right">
        <span class="env" id="env-badge">…</span>
        <button class="wallet" id="wallet-btn" type="button" disabled>Connect wallet</button>
      </div>
    </header>

    <div class="scroll">
      <div id="screen"></div>
      <footer>
        <span id="generated-at">…</span> · every value is read from the backend;
        nothing on this screen is simulated
      </footer>
    </div>

  </div>
</div>

<script src="/static/console.js"></script>
</body>
</html>
