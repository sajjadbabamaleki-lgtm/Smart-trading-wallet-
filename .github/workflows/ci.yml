name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A workflow that can reach nothing has nothing to leak. Build 0.1 runs no
# deployment and holds no production secret, so the token is read-only and no
# environment is attached (Phase 10 §34: untrusted pull requests must never
# gain production secrets).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Typecheck
        run: uv run mypy libs services tests

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a credential deleted in a later commit is still
          # compromised and still present in the objects (Phase 10 §41).
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Audits the locked dependency set rather than the installed
      # environment: the project itself is an editable install that is not on
      # PyPI, which --strict would otherwise treat as an un-auditable
      # dependency and fail on.
      - name: Export locked dependencies
        run: uv export --extra dev --no-emit-project --format requirements.txt > requirements-audit.txt

      - name: Audit
        run: uv run pip-audit --strict --requirement requirements-audit.txt
