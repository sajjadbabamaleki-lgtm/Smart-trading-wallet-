[project]
name = "smart-trading-wallet"
version = "0.1.0"
description = "AI-powered automated perpetual futures trading platform — Build 0.1 foundation"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # M1 storage clients. One per store, each the store's standard client.
    "psycopg[binary]>=3.2,<4",
    "clickhouse-connect>=0.8,<1",
    "redis>=5.1,<7",
    "boto3>=1.35,<2",
    # M2 recorder. The venue WebSocket client.
    "websockets>=13,<16",
    # M4 research datasets. The declared analytical foundation
    # (Build 0.1 Rev.1 §8-9), used to write Parquet.
    "polars>=1.12,<2",
    # The product console (apps/). A read-only HTTP boundary is the minimum
    # a product interface needs, and these two are the smallest way to have
    # one without a build step or a JavaScript toolchain.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

# Production dependencies stay deliberately small (Build 0.1 Rev.1 §7).
# Polars arrives with M4, which is the milestone that first writes a dataset;
# it was deliberately absent until something imported it. NumPy is still not
# imported by any module and so is still not here.

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "boto3-stubs[s3]>=1.35,<2",
    # Starlette's TestClient needs it. Dev-only: the console API itself
    # makes no outbound HTTP calls.
    "httpx2>=2.13,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — a naive timestamp in market data is a defect
    "T20",       # no print() in library code
    "SIM",       # simplify
    "RET",       # return consistency
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "TRY",       # exception antipatterns
    "RUF",
    "S",         # bandit security rules
    "BLE",       # blind except — must be justified, never accidental
]
ignore = [
    "TRY003",    # long messages inside raise — a refusal to start must explain why
    "PLR0911",   # many returns — validators read better flat
]

[tool.ruff.lint.per-file-ignores]
"infrastructure/scripts/**" = [
    "T201",      # these are CLIs; printing is the output
    "PLR0915",   # an orchestrator is a linear sequence; splitting it hides the order of operations
]
"services/*/cli.py" = [
    "T201",      # likewise — a CLI's report goes to stdout
]
"services/*/*_cli.py" = [
    "T201",      # a package may have more than one entry point
]
"services/market_data/acceptance.py" = [
    "PLR0912",   # the decision logic is a flat list of checks; nesting it would hide the criteria
    "PLR0913",   # each argument is a distinct piece of evidence, not config to bundle
]
"tests/**" = [
    "S101",      # assert is the point of a test
    "PLR2004",   # literal comparisons are clearer than named constants in assertions
    "ARG001",    # fixtures are injected by name
    "DTZ001",    # naive datetimes are constructed deliberately, to prove they are rejected
    "PLR0913",   # keyword-only builders for test fixtures read better than nested config objects
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# clickhouse-connect ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires the local Docker Compose stack",
    "replay: deterministic replay of recorded fixtures",
    "failure: deliberate failure injection",
    "security: authorization and environment boundary checks",
]

[tool.coverage.run]
source = ["libs", "services"]
branch = true
